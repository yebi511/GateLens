services:
  gatelens-api:
    image: ${GATELENS_API_IMAGE:-ghcr.io/gatelens/gatelens-api:dev}
    environment:
      GATELENS_ADDR: ":8080"
      GATELENS_MODE: server
      GATELENS_CLUSTER_ID: ${GATELENS_SERVER_CLUSTER_ID:-federation}
      GATELENS_AGENT_TOKEN: ${GATELENS_AGENT_TOKEN:?GATELENS_AGENT_TOKEN must be set}
      GATELENS_STALE_AFTER: ${GATELENS_STALE_AFTER:-2m}
    expose:
      - "8080"
    restart: unless-stopped

  gatelens-web:
    image: ${GATELENS_WEB_IMAGE:-ghcr.io/gatelens/gatelens-web:dev}
    environment:
      GATELENS_API_UPSTREAM: http://gatelens-api:8080
    ports:
      - "${GATELENS_BIND_ADDRESS:-0.0.0.0}:${GATELENS_HTTP_PORT:-8080}:8080"
    depends_on:
      - gatelens-api
    restart: unless-stopped
