apiVersion: v1
kind: Namespace
metadata:
  name: gatelens-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatelens-agent
  namespace: gatelens-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatelens-readonly
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "referencegrants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.higress.io"]
    resources: ["mcpbridges"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatelens-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatelens-readonly
subjects:
  - kind: ServiceAccount
    name: gatelens-agent
    namespace: gatelens-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatelens-api
  namespace: gatelens-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: api}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/gatelens/gatelens-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: GATELENS_ADDR, value: ":8080"}
            - {name: GATELENS_MODE, value: "server"}
            - {name: GATELENS_CLUSTER_ID, value: "edge-prod"}
            - name: GATELENS_AGENT_TOKEN
              valueFrom:
                secretKeyRef: {name: gatelens-agent-auth, key: token}
            - {name: GATELENS_STALE_AFTER, value: "2m"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatelens-agent
  namespace: gatelens-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: agent}
    spec:
      serviceAccountName: gatelens-agent
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: ghcr.io/gatelens/gatelens-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: GATELENS_MODE, value: "agent"}
            - {name: GATELENS_CLUSTER_ID, value: "edge-prod"}
            - {name: GATELENS_CLUSTER_NAME, value: "Gateway Production"}
            - {name: GATELENS_CLUSTER_ROLE, value: "ingress-gateway"}
            - {name: GATELENS_SERVER_URL, value: "http://gatelens-api:8080"}
            - {name: GATELENS_AGENT_INTERVAL, value: "30s"}
            - name: GATELENS_AGENT_TOKEN
              valueFrom:
                secretKeyRef: {name: gatelens-agent-auth, key: token}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gatelens-api
  namespace: gatelens-system
spec:
  selector: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatelens-web
  namespace: gatelens-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: web}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: ghcr.io/gatelens/gatelens-web:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: GATELENS_API_UPSTREAM, value: "http://gatelens-api:8080"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - {name: nginx-conf, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: gatelens
  namespace: gatelens-system
spec:
  selector: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: web}
  ports: [{name: http, port: 80, targetPort: http}]
