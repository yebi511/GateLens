apiVersion: v1
kind: Namespace
metadata:
  name: gatelens-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatelens-agent
  namespace: gatelens-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatelens-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "referencegrants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.higress.io"]
    resources: ["mcpbridges"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatelens-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatelens-agent-readonly
subjects:
  - kind: ServiceAccount
    name: gatelens-agent
    namespace: gatelens-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatelens-agent
  namespace: gatelens-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gatelens, app.kubernetes.io/component: agent}
    spec:
      serviceAccountName: gatelens-agent
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: ghcr.io/gatelens/gatelens-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: GATELENS_MODE, value: "agent"}
            - {name: GATELENS_CLUSTER_ID, value: "gpu-prod"}
            - {name: GATELENS_CLUSTER_NAME, value: "GPU Production"}
            - {name: GATELENS_CLUSTER_ROLE, value: "gpu-inference"}
            - {name: GATELENS_SERVER_URL, value: "https://gatelens.example.com"}
            - {name: GATELENS_AGENT_INTERVAL, value: "30s"}
            - name: GATELENS_AGENT_TOKEN
              valueFrom:
                secretKeyRef: {name: gatelens-agent-auth, key: token}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
